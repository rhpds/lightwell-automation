apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-password-setter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-password-setter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openshift-gitops-cluster"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-password-setter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-password-setter
subjects:
  - kind: ServiceAccount
    name: argocd-password-setter
    namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: set-argocd-admin-password
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: argocd-password-setter
      restartPolicy: OnFailure
      containers:
        - name: set-password
          image: {{ .Values.jobAnsibleImage }}
          command:
            - /bin/bash
            - -c
            - |
              HASH=$(python3 -c "import bcrypt; print(bcrypt.hashpw(b'{{ .Values.admin.password }}', bcrypt.gensalt()).decode())")
              oc patch secret openshift-gitops-cluster -n openshift-gitops \
                -p "{\"data\":{\"admin.password\":\"$(echo -n $HASH | base64 -w0)\"}}"
