apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifactory-postgresql
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:openshift:scc:anyuid-artifactory-pg
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: artifactory-postgresql
    namespace: {{ .Values.artifactory.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactory-postgresql
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      name: artifactory-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        name: artifactory-postgresql
    spec:
      serviceAccountName: artifactory-postgresql
      containers:
        - name: postgresql
          image: {{ .Values.artifactory.postgresqlImage }}
          env:
            - name: POSTGRES_USER
              value: artifactory
            - name: POSTGRES_PASSWORD
              value: artpass
            - name: POSTGRES_DB
              value: artifactory
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            exec:
              command: [pg_isready, -h, localhost, -U, artifactory]
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -h, localhost, -U, artifactory]
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: artifactory-postgresql
