apiVersion: batch/v1
kind: Job
metadata:
  name: set-artifactory-admin-password
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-password
          image: curlimages/curl:8.8.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Artifactory to be ready..."
              for i in $(seq 1 60); do
                if curl -sf http://artifactory:8082/router/api/v1/system/readiness; then
                  echo "Artifactory is ready"
                  break
                fi
                echo "Attempt $i/60 - waiting..."
                sleep 10
              done

              echo "Changing admin password..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST "http://artifactory:8082/access/api/v1/users/admin/password" \
                -H "Content-Type: application/json" \
                -u "admin:password" \
                -d '{"newPassword": "{{ .Values.admin.password }}"}')

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
                echo "Password changed successfully"
                exit 0
              elif [ "$HTTP_CODE" = "401" ]; then
                echo "Default password already changed (401) - password may already be set"
                exit 0
              else
                echo "Failed to change password (HTTP $HTTP_CODE)"
                exit 1
              fi
