apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifactory-data
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  storageClassName: {{ .Values.deployer.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.artifactory.storageSize }}
