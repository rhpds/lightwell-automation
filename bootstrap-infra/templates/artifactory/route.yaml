apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: artifactory
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  port:
    targetPort: router
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: artifactory
