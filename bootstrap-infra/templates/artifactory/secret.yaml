apiVersion: v1
kind: Secret
metadata:
  name: artifactory-keys
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  master.key: {{ .Values.admin.password | sha256sum | trunc 32 | quote }}
  join.key: {{ .Values.admin.password | sha256sum | trunc 32 | quote }}
