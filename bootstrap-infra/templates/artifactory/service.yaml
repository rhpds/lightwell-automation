apiVersion: v1
kind: Service
metadata:
  name: artifactory
  namespace: {{ .Values.artifactory.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: router
      port: 8082
      targetPort: router
  selector:
    app: artifactory
