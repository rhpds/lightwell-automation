apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-persistent-storage
  namespace: {{ .Values.gitlab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  storageClassName: {{ .Values.deployer.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
