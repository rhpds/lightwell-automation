apiVersion: v1
kind: Secret
metadata:
  name: gitlab-secret
  namespace: {{ .Values.gitlab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  DB_PASS: {{ .Values.gitlab.rootPassword }}
  GITLAB_ROOT_PASSWORD: {{ .Values.gitlab.rootPassword }}
  GITLAB_SECRETS_DB_KEY_BASE: {{ .Values.admin.password | sha256sum | quote }}
  GITLAB_SECRETS_OTP_KEY_BASE: {{ printf "%s-otp" .Values.admin.password | sha256sum | quote }}
  GITLAB_SECRETS_SECRET_KEY_BASE: {{ printf "%s-secret" .Values.admin.password | sha256sum | quote }}
