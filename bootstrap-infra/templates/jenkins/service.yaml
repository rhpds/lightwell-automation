apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: {{ .Values.jenkins.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: agent
      port: 50000
      targetPort: agent
  selector:
    app: jenkins
