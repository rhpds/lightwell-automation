apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sonarqube
  namespace: {{ .Values.sonarqube.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: sonarqube
