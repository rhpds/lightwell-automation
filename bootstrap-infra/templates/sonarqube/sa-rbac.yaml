apiVersion: v1
kind: ServiceAccount
metadata:
  name: sonarqube
  namespace: {{ .Values.sonarqube.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonarqube-privileged
  namespace: {{ .Values.sonarqube.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: sonarqube
    namespace: {{ .Values.sonarqube.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
