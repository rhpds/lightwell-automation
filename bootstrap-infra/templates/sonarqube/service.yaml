apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: {{ .Values.sonarqube.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: http
      port: 9000
      targetPort: http
  selector:
    app: sonarqube
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube-postgresql
  namespace: {{ .Values.sonarqube.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: sonarqube-postgresql
