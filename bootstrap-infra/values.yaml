deployer:
  domain: apps.cluster-guid.sandbox.opentlc.com
  storageClass: ocs-external-storagecluster-ceph-rbd-immediate

admin:
  password: changeme

gitlab:
  namespace: gitlab
  image: quay.io/redhat-gpte/gitlab:17.4.1
  postgresqlImage: quay.io/redhat-gpte/gitlab-postgresql:14
  redisImage: redis:6.2.6
  rootPassword: changeme
  repos: []

rhtas:
  namespace: lightwell-tas
  channel: stable-v1.4

tpa:
  namespace: lightwell-tpa
  channel: stable-v1.1

artifactory:
  namespace: lightwell-artifactory
  image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.98.14
  postgresqlImage: docker.io/library/postgres:16-alpine
  storageSize: 20Gi

jenkins:
  namespace: lightwell-jenkins
  image: registry.redhat.io/ocp-tools-4/jenkins-rhel9:v4.17.0-1750853657
  password: changeme
  storageSize: 20Gi

sonarqube:
  namespace: lightwell-sonarqube
  image: docker.io/sonarqube:community
  postgresqlImage: docker.io/library/postgres:16-alpine
  storageSize: 10Gi

aap:
  namespace: aap
  channel: stable-2.6
  manifestUrl: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip

jobAnsibleImage: quay.io/agnosticd/ee-multicloud:latest
